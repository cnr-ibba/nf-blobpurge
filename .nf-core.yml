repository_type: pipeline

nf_core_version: 4.1.0

lint:
  # This pipeline is not hosted on nf-core/configs (org: cnr-ibba, is_nfcore: false), so the
  # pipeline-specific includeConfig line in nextflow.config is deliberately left commented out --
  # uncommenting it would make every run fetch a nonexistent remote config and fail.
  included_configs: false
  files_unchanged:
    - CODE_OF_CONDUCT.md
    - assets/nf-core-nf-blobpurge_logo_light.png
    - docs/images/nf-core-nf-blobpurge_logo_light.png
    - docs/images/nf-core-nf-blobpurge_logo_dark.png
    - .github/ISSUE_TEMPLATE/bug_report.yml
    - .github/PULL_REQUEST_TEMPLATE.md
    - .github/workflows/branch.yml
    - assets/email_template.txt
    - docs/README.md
  nextflow_config:
    - manifest.name
    - manifest.homePage
  multiqc_config:
    - report_comment
  files_exist:
    - CODE_OF_CONDUCT.md
    - assets/nf-core-nf-blobpurge_logo_light.png
    - docs/images/nf-core-nf-blobpurge_logo_light.png
    - docs/images/nf-core-nf-blobpurge_logo_dark.png
    - .github/ISSUE_TEMPLATE/config.yml
    - .github/workflows/awstest.yml
    - .github/workflows/awsfulltest.yml
    - conf/igenomes.config
    - conf/igenomes_ignored.config

template:
  org: cnr-ibba
  name: nf-blobpurge
  description: Filter contaminant contigs from a BlobToolKit-classified genome assembly
    and quantify heterozygous haplotig duplication with purge_dups/purge_haplotigs
    and comparative BUSCO.
  author: Paolo Cozzi
  version: 1.0.0dev
  force: true
  outdir: .
  skip_features:
    - gpu
  is_nfcore: false
