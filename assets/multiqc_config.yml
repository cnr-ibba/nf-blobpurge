report_comment: >
  This report has been generated by the <a href="https://github.com/cnr-ibba/nf-blobpurge/tree/dev" target="_blank">cnr-ibba/nf-blobpurge</a>
  analysis pipeline.
report_section_order:
  "cnr-ibba-nf-blobpurge-methods-description":
    order: -1000
  software_versions:
    order: -1001
  "cnr-ibba-nf-blobpurge-summary":
    order: -1002

export_plots: true

disable_version_detection: true

# BUSCO short_summary files are named "short_summary.<sample>.<stage>.<lineage>.txt"
# (see modules/local/busco/main.nf) so the "short_summary." prefix must be
# stripped explicitly -- MultiQC's default fn_clean_trim only strips the
# older BUSCO v3/v4 "short_summary_" (underscore) naming.
extra_fn_clean_exts:
  - type: remove
    pattern: "short_summary."
